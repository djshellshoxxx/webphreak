name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'email2sms/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'email2sms/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Unit tests (catalog, timing, spectrum, WAV, formulas)
        run: node --test tests/unit.test.js tests/formula.test.js
