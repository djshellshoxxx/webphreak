<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>email2sms</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; background:#0e0e12; color:#eee; }
  h1 { font-size: 1.2rem; }
  label { display:block; margin-top: 12px; font-size: 0.85rem; color:#aaa; }
  input, select, textarea { width:100%; padding:8px; margin-top:4px; background:#1a1a20; color:#eee; border:1px solid #333; border-radius:4px; box-sizing:border-box; }
  textarea { resize: vertical; min-height: 80px; }
  button { margin-top:16px; width:100%; padding:10px; background:#3a7bd5; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  #status { margin-top:12px; font-size:0.85rem; }
  .err { color:#f55; }
  .ok { color:#6f6; }
  #count { font-size:0.75rem; color:#888; text-align:right; }
</style>
</head>
<body>
<h1>Send SMS via email gateway</h1>
<form id="f">
  <label>Phone number
    <input id="number" type="tel" placeholder="604 555 0123" required>
  </label>
  <label>Carrier
    <select id="carrier" required></select>
  </label>
  <label>Message
    <textarea id="message" maxlength="160" required></textarea>
  </label>
  <div id="count">0 / 160</div>
  <button type="submit">Send</button>
</form>
<div id="status"></div>

<script>
const carrierSel = document.getElementById('carrier');
const msg = document.getElementById('message');
const count = document.getElementById('count');
const status = document.getElementById('status');
const form = document.getElementById('f');

msg.addEventListener('input', () => {
  count.textContent = `${msg.value.length} / 160`;
});

fetch('/api/carriers').then(r => r.json()).then(list => {
  list.sort((a,b) => a.name.localeCompare(b.name)).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    carrierSel.appendChild(opt);
  });
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = form.querySelector('button');
  btn.disabled = true;
  status.textContent = 'Sending...';
  status.className = '';
  try {
    const res = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        number: document.getElementById('number').value,
        carrier: carrierSel.value,
        message: msg.value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Send failed');
    status.textContent = `Sent to ${data.to}`;
    status.className = 'ok';
    form.reset();
    count.textContent = '0 / 160';
  } catch (err) {
    status.textContent = err.message;
    status.className = 'err';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
